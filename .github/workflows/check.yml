name: Public BJJ journey checks
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-journeys
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        environment: [staging]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Check public journeys and report evidence
        run: npm run check
        env:
          OPS_SITE_URL: ${{ vars.OPS_SITE_URL }}
          OPS_PAST_EVENT_PATH: ${{ vars.OPS_PAST_EVENT_PATH }}
          OPS_MONITOR_URL: ${{ vars.OPS_MONITOR_URL }}
          OPS_MONITOR_READ_TOKEN: ${{ secrets.OPS_MONITOR_READ_TOKEN }}
          OPS_EXTERNAL_WRITE_TOKEN: ${{ secrets.OPS_EXTERNAL_WRITE_TOKEN }}
